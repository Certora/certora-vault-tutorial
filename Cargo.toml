[workspace]
members = ["programs/vault"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = 'thin'

[workspace.dependencies]
solana-program = "2.2"
spl-token = { version = "8.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "1.1.3", features = [ "no-entrypoint", ] }
bytemuck = { version = "1.4.0", features = ["derive"] }
num_enum = "0.7.3"
spl-pod = "0.5.1"



# === Certora CVLR — added by AutoProver ===
[workspace.dependencies.cvlr]
version = "=0.6.1"

[workspace.dependencies.cvlr-solana]
version = "=0.5.0"

[workspace.dependencies.cvlr-solana-stake]
version = "=0.5.0"

[workspace.dependencies.cvlr-spl-token]
version = "=0.5.0"
